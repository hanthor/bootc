name: Build and Release bootc v1.15.1

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.15.1*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.15.1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build bootc
        run: |
          cargo build --release --bins
          mkdir -p release-bin
          cp target/release/bootc release-bin/
          cp target/release/system-reinstall-bootc release-bin/ 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-bin/bootc
            release-bin/system-reinstall-bootc
          tag_name: v1.15.1-ubuntu
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
